<span data-line><span>void QRoundProgressBar::setRange(double min, double max)</span></span>
<span data-line><span>{</span></span>
<span data-line><span>    m_min = min;</span></span>
<span data-line><span>    m_max = max;</span></span>
<span data-line><span> </span></span>
<span data-line><span>    if (m_max &lt; m_min)</span></span>
<span data-line><span>    {</span></span>
<span data-line><span>        qSwap(m_max, m_min);</span></span>
<span data-line><span>    }</span></span>
<span data-line><span> </span></span>
<span data-line><span>    if (m_value &lt; m_min)</span></span>
<span data-line><span>    {</span></span>
<span data-line><span>        m_value = m_min;</span></span>
<span data-line><span>    }</span></span>
<span data-line><span>    else if (m_value > m_max)</span></span>
<span data-line><span>    {</span></span>
<span data-line><span>        m_value = m_max;</span></span>
<span data-line><span>    }</span></span>
<span data-line><span> </span></span>
<span data-line><span>    update();</span></span>
<span data-line><span>}</span></span>
<span data-line><span> </span></span>
<span data-line><span>void QRoundProgressBar::setValue(double val)</span></span>
<span data-line><span>{</span></span>
<span data-line><span>    if (m_value != val)</span></span>
<span data-line><span>    {</span></span>
<span data-line><span>        if (val &lt; m_min)</span></span>
<span data-line><span>        {</span></span>
<span data-line><span>            m_value = m_min;</span></span>
<span data-line><span>        }</span></span>
<span data-line><span>        else if (val > m_max)</span></span>
<span data-line><span>        {</span></span>
<span data-line><span>            m_value = m_max;</span></span>
<span data-line><span>        }</span></span>
<span data-line><span>        else</span></span>
<span data-line><span>        {</span></span>
<span data-line><span>            m_value = val;</span></span>
<span data-line><span>        }</span></span>
<span data-line><span>        update();</span></span>
<span data-line><span>    }</span></span>
<span data-line><span>}</span></span>

<span data-line><span>void QRoundProgressBar::paintEvent(QPaintEvent* /*event*/)</span></span>
<span data-line><span>{</span></span>
<span data-line><span>    //外圈直径</span></span>
<span data-line><span>    double outerDiameter = this->width();</span></span>
<span data-line><span> </span></span>
<span data-line><span>    //外圈矩形</span></span>
<span data-line><span>    QRectF baseRect(0, 0, outerDiameter, outerDiameter);</span></span>
<span data-line><span> </span></span>
<span data-line><span>    QPainter p(this);</span></span>
<span data-line><span>    p.setRenderHints(QPainter::Antialiasing | QPainter::SmoothPixmapTransform);</span></span>
<span data-line><span> </span></span>
<span data-line><span>    //画背景矩形填充白色</span></span>
<span data-line><span>    p.fillRect(baseRect, QBrush(QColor(&quot;#FFFFFF&quot;)));</span></span>
<span data-line><span> </span></span>
<span data-line><span>    //内圆直径</span></span>
<span data-line><span>    double innerDiameter = width() * 0.9;</span></span>
<span data-line><span> </span></span>
<span data-line><span>    //内圈矩形</span></span>
<span data-line><span>    QRectF innerRect;</span></span>
<span data-line><span> </span></span>
<span data-line><span>    //计算内圈矩形</span></span>
<span data-line><span>    if (m_barStyle == StyleLine)</span></span>
<span data-line><span>    {</span></span>
<span data-line><span>        innerDiameter = outerDiameter - m_outlinePenWidth;</span></span>
<span data-line><span>    }</span></span>
<span data-line><span> </span></span>
<span data-line><span>    else if(m_barStyle == StyleDonut)</span></span>
<span data-line><span>    {</span></span>
<span data-line><span>        innerDiameter = outerDiameter * 0.9;</span></span>
<span data-line><span>    }</span></span>
<span data-line><span> </span></span>
<span data-line><span>    double delta = (outerDiameter - innerDiameter) / 2;</span></span>
<span data-line><span> </span></span>
<span data-line><span>    innerRect = QRectF(delta, delta, innerDiameter, innerDiameter);</span></span>
<span data-line><span> </span></span>
<span data-line><span> </span></span>
<span data-line><span>    //画基础图形</span></span>
<span data-line><span>    drawBase(p, baseRect, innerRect);</span></span>
<span data-line><span> </span></span>
<span data-line><span>    //计算当前步长比例</span></span>
<span data-line><span>    double arcStep = 360.0 / (m_max - m_min) * m_value;</span></span>
<span data-line><span> </span></span>
<span data-line><span>    //根据值画出进度条</span></span>
<span data-line><span>    drawValue(p, baseRect, m_value, arcStep, innerRect, innerDiameter);</span></span>
<span data-line><span> </span></span>
<span data-line><span>    //画文字</span></span>
<span data-line><span>    drawText(p, baseRect, m_value);</span></span>
<span data-line><span> </span></span>
<span data-line><span>    p.end();</span></span>
<span data-line><span>}</span></span>
<span data-line><span> </span></span>
<span data-line><span>void QRoundProgressBar::drawBase(QPainter &amp;p, const QRectF &amp;baseRect, const QRectF &amp;innerRect)</span></span>
<span data-line><span>{</span></span>
<span data-line><span>    switch (m_barStyle)</span></span>
<span data-line><span>    {</span></span>
<span data-line><span>        case StyleDonut:</span></span>
<span data-line><span>        {</span></span>
<span data-line><span>            QPainterPath dataPath;</span></span>
<span data-line><span>            dataPath.setFillRule(Qt::OddEvenFill);</span></span>
<span data-line><span>            dataPath.moveTo(baseRect.center());</span></span>
<span data-line><span>            dataPath.addEllipse(innerRect);</span></span>
<span data-line><span> </span></span>
<span data-line><span>            QPen pen;</span></span>
<span data-line><span>            pen.setColor(QColor(&quot;#DEE3E7&quot;));</span></span>
<span data-line><span>            pen.setWidth(10);</span></span>
<span data-line><span>            p.setPen(pen);</span></span>
<span data-line><span>            p.setBrush(QBrush(QColor(&quot;#FFFFFF&quot;)));</span></span>
<span data-line><span>        </span></span>
<span data-line><span>            p.drawPath(dataPath);</span></span>
<span data-line><span>            break;</span></span>
<span data-line><span>        }</span></span>
<span data-line><span> </span></span>
<span data-line><span>        case StylePie:</span></span>
<span data-line><span>        {</span></span>
<span data-line><span>            p.setPen(QPen(QColor(&quot;#FFFFFF&quot;), m_outlinePenWidth));</span></span>
<span data-line><span>            p.setBrush(QBrush(QColor(&quot;#DEE3E7&quot;)));</span></span>
<span data-line><span>            p.drawEllipse(baseRect);</span></span>
<span data-line><span>            break;</span></span>
<span data-line><span>        }</span></span>
<span data-line><span> </span></span>
<span data-line><span>        case StyleLine:</span></span>
<span data-line><span>        {</span></span>
<span data-line><span>            p.setPen(QPen(QColor(&quot;#FFFFFF&quot;), m_outlinePenWidth));</span></span>
<span data-line><span>            p.setBrush(Qt::NoBrush);</span></span>
<span data-line><span>            p.drawEllipse(baseRect.adjusted(m_outlinePenWidth / 2, m_outlinePenWidth / 2, -m_outlinePenWidth / 2, -m_outlinePenWidth / 2));</span></span>
<span data-line><span>            break;</span></span>
<span data-line><span>        }</span></span>
<span data-line><span> </span></span>
<span data-line><span>        default:</span></span>
<span data-line><span>        {</span></span>
<span data-line><span>            break;</span></span>
<span data-line><span>        }</span></span>
<span data-line><span>    }</span></span>
<span data-line><span>}</span></span>
<span data-line><span> </span></span>
<span data-line><span>void QRoundProgressBar::drawValue(QPainter &amp;p, const QRectF &amp;baseRect , double value, double arcLength</span></span>
<span data-line><span>                          , const QRectF &amp; innerRect, double innerDiameter)</span></span>
<span data-line><span>{</span></span>
<span data-line><span>    if (value == m_min)</span></span>
<span data-line><span>    {</span></span>
<span data-line><span>        return;</span></span>
<span data-line><span>    }</span></span>
<span data-line><span> </span></span>
<span data-line><span>    if (m_barStyle == StyleLine)</span></span>
<span data-line><span>    {</span></span>
<span data-line><span>        p.setPen(QColor(&quot;#2F8DED&quot;));</span></span>
<span data-line><span>        p.setBrush(Qt::NoBrush);</span></span>
<span data-line><span>        p.drawArc(baseRect,m_startAngel * 16, -arcLength * 16);</span></span>
<span data-line><span>    }</span></span>
<span data-line><span>    else if (m_barStyle == StyleDonut)</span></span>
<span data-line><span>    {</span></span>
<span data-line><span>        QPen pen;</span></span>
<span data-line><span>        pen.setColor(QColor(&quot;#2F8DED&quot;));</span></span>
<span data-line><span>        pen.setWidth(8);</span></span>
<span data-line><span>        pen.setCapStyle(Qt::RoundCap);</span></span>
<span data-line><span>        p.setPen(pen);</span></span>
<span data-line><span>        p.drawArc(innerRect, m_startAngel*16 , -16*arcLength);</span></span>
<span data-line><span>    }</span></span>
<span data-line><span>    else</span></span>
<span data-line><span>    {</span></span>
<span data-line><span>        //获取中心点坐标</span></span>
<span data-line><span>        QPointF centerPoint = baseRect.center();</span></span>
<span data-line><span>        QPainterPath dataPath;</span></span>
<span data-line><span>        dataPath.setFillRule(Qt::WindingFill);</span></span>
<span data-line><span>        dataPath.moveTo(centerPoint);</span></span>
<span data-line><span>        //逆时针画弧长</span></span>
<span data-line><span>        dataPath.arcTo(baseRect, m_startAngel, -arcLength);</span></span>
<span data-line><span>        if (m_barStyle == StylePie)</span></span>
<span data-line><span>        {</span></span>
<span data-line><span>            dataPath.lineTo(centerPoint);</span></span>
<span data-line><span>            p.setPen(QPen(QColor(&quot;#2F8DED&quot;), m_dataPenWidth));</span></span>
<span data-line><span>        }</span></span>
<span data-line><span>        p.setBrush(QBrush(QColor(&quot;#2F8DED&quot;)));</span></span>
<span data-line><span>        p.drawPath(dataPath);</span></span>
<span data-line><span>    }</span></span>
<span data-line><span> </span></span>
<span data-line><span>}</span></span>
<span data-line><span> </span></span>
<span data-line><span>void QRoundProgressBar::drawText(QPainter &amp;p, const QRectF &amp;rect, double value)</span></span>
<span data-line><span>{</span></span>
<span data-line><span>    QString textToDraw = &quot;%&quot;;</span></span>
<span data-line><span>    double percent = (value - m_min) / (m_max - m_min) * 100.0;</span></span>
<span data-line><span>    textToDraw = QString::number(percent, 'f', m_decimals) + textToDraw;</span></span>
<span data-line><span> </span></span>
<span data-line><span>    QFont f;</span></span>
<span data-line><span>    f.setFamily(&quot;微软雅黑&quot;);</span></span>
<span data-line><span>    f.setPixelSize(20);</span></span>
<span data-line><span> </span></span>
<span data-line><span>    p.setFont(f);</span></span>
<span data-line><span>    p.setPen(QColor(&quot;#606266&quot;));</span></span>
<span data-line><span> </span></span>
<span data-line><span>    p.drawText(rect, Qt::AlignCenter, textToDraw);</span></span>
<span data-line><span>}</span></span></code></pre></figure></div></article><hr/><div class="page-footer"></div></div><div class="right sidebar"><div class="graph"><h3>关系图谱</h3><div class="graph-outer"><div class="graph-container" data-cfg="{&quot;drag&quot;:true,&quot;zoom&quot;:true,&quot;depth&quot;:1,&quot;scale&quot;:1.1,&quot;repelForce&quot;:0.5,&quot;centerForce&quot;:0.3,&quot;linkDistance&quot;:30,&quot;fontSize&quot;:0.6,&quot;opacityScale&quot;:1,&quot;showTags&quot;:true,&quot;removeTags&quot;:[],&quot;focusOnHover&quot;:false,&quot;enableRadial&quot;:false}"></div><button class="global-graph-icon" aria-label="Global Graph"><svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px" viewBox="0 0 55 55" fill="currentColor" xml:space="preserve"><path d="M49,0c-3.309,0-6,2.691-6,6c0,1.035,0.263,2.009,0.726,2.86l-9.829,9.829C32.542,17.634,30.846,17,29,17
