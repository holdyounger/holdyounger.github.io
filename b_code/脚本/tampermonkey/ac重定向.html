<span data-line><span>!(function () {</span></span>
<span data-line><span>  let isdebug = false // 调试日志用</span></span>
<span data-line><span>  let isLocalDebug = false // 加载本地资源用，调试的时候小心GM的缓存机制</span></span>
<span data-line><span>  let debug = isdebug ? console.log.bind(console) : () => {}</span></span>
<span data-line><span>  let acCssLoadFlag = false</span></span>
<span data-line> </span>
<span data-line><span>  let inExtMode = typeof isExtension !== 'undefined'</span></span>
<span data-line><span>  let inGMMode = typeof GM_info.scriptHandler !== 'undefined' // = &quot;Greasemonkey&quot; || &quot;Tampermonkey&quot; || &quot;ViolentMonkey&quot;</span></span>
<span data-line><span>  // inExtMode &amp; inGMMode</span></span>
<span data-line><span>  // true    true =扩展下的GM代码 不执行</span></span>
<span data-line><span>  // true    false=扩展下代码 执行</span></span>
<span data-line><span>  // false  true =仅GM代码 执行</span></span>
<span data-line><span>  // false  false=异常 但是还是要执行代码</span></span>
<span data-line><span>  debug('程序开始')</span></span>
<span data-line><span>  if (</span></span>
<span data-line><span>    (inExtMode === true &amp;&amp; inGMMode === true) ||</span></span>
<span data-line><span>    typeof window.AC666Init !== 'undefined'</span></span>

<span data-line><span>    console.log('扩展模式-脚本不启用')</span></span>
<span data-line><span>    return</span></span>
<span data-line><span>  }</span></span>
<span data-line><span>  window.AC666Init = true</span></span>
<span data-line><span>  if (typeof GM === 'undefined') {</span></span>
<span data-line><span>    // 这个是ViolentMonkey的支持选项</span></span>

<span data-line><span>    GM.setValue = GM_setValue</span></span>
<span data-line><span>    GM.getValue = GM_getValue</span></span>
<span data-line><span>  }</span></span>
<span data-line><span>  // 增加了一个css的缓冲层，保证多次CSS操作不导致页面卡顿，减少重排的次数</span></span>
<span data-line><span>  class FlushDomFragment {</span></span>
<span data-line><span>    constructor() {</span></span>
<span data-line><span>      this.init()</span></span>
<span data-line><span>    }</span></span>
<span data-line> </span>
<span data-line><span>    init() {</span></span>
<span data-line><span>      this.length = 0</span></span>
<span data-line> </span>
<span data-line><span>      this.fragmentHead = document.createDocumentFragment()</span></span>
<span data-line><span>      this.fragmentBody = document.createDocumentFragment()</span></span>
<span data-line><span>      this.fragmentDOM = document.createDocumentFragment()</span></span>
<span data-line> </span>
<span data-line><span>      this.reloadList = [] // 所有需要动态刷新的都在这里面</span></span>
<span data-line><span>    }</span></span>
<span data-line> </span>
<span data-line><span>    _removeReload() {</span></span>
<span data-line><span>      this.reloadList.map((selector) => {</span></span>
<span data-line><span>        safeRemove(selector)</span></span>
<span data-line><span>      })</span></span>
<span data-line><span>    }</span></span>
<span data-line> </span>
<span data-line><span>    _singleInsert(node, toDom, checkDom) {</span></span>
<span data-line><span>      if (node) {</span></span>
<span data-line><span>        const { dataset: { xclass: selector = '' } = {}, tagName = '' } = node</span></span>
<span data-line><span>        if (tagName.toUpperCase() === 'STYLE') {</span></span>
<span data-line><span>          if (selector) {</span></span>
<span data-line><span>            if (checkDom.querySelector(selector)) return</span></span>
<span data-line><span>          } else {</span></span>
<span data-line><span>            console.error('出现没有样式的节点', node)</span></span>
<span data-line><span>          }</span></span>
<span data-line><span>        }</span></span>
<span data-line> </span>
<span data-line><span>        toDom.appendChild(node)</span></span>
<span data-line> </span>
<span data-line><span>        this.length += 1</span></span>
<span data-line><span>        debug('增加节点', node)</span></span>
<span data-line><span>        debug('长度变化', this.length)</span></span>
<span data-line><span>      }</span></span>
<span data-line><span>    }</span></span>
<span data-line> </span>
<span data-line><span>    // 如果CSS已经存在了，那么就不再添加了</span></span>
<span data-line><span>    _dropMultiCSS(fragment) {</span></span>
<span data-line><span>      const newFrag = document.createDocumentFragment()</span></span>
<span data-line><span>      ;[...fragment.childNodes].map((node) => {</span></span>
<span data-line><span>        this._singleInsert(node, newFrag, document)</span></span>
<span data-line><span>      })</span></span>
<span data-line><span>      return newFrag</span></span>
<span data-line><span>    }</span></span>
<span data-line> </span>
<span data-line><span>    flush() {</span></span>
<span data-line><span>      if (this.length > 0) {</span></span>
<span data-line><span>        // 有数据，才进行flush，否则没有必要</span></span>
<span data-line><span>        this._removeReload()</span></span>
<span data-line> </span>
<span data-line><span>        // MARK 保证线程安全，将现有数据暂存，然后生成新的节点，避免其他js插入后丢失</span></span>
<span data-line><span>        const curBodyFrag = this.fragmentBody</span></span>
<span data-line><span>        const curHeadFrag = this.fragmentHead</span></span>
<span data-line><span>        const curDomFrag = this.fragmentDOM</span></span>
<span data-line> </span>
<span data-line><span>        this.init()</span></span>
<span data-line> </span>
<span data-line><span>        // 数据清除</span></span>
<span data-line><span>        const newBodyFrag = this._dropMultiCSS(curBodyFrag)</span></span>
<span data-line><span>        const newHeadFrag = this._dropMultiCSS(curHeadFrag)</span></span>
<span data-line><span>        const newDomFrag = this._dropMultiCSS(curDomFrag)</span></span>
<span data-line> </span>
<span data-line><span>        debug('数据flush1', newBodyFrag.children.length)</span></span>
<span data-line><span>        debug('数据flush2', newHeadFrag.children.length)</span></span>
<span data-line><span>        debug('数据flush3', newDomFrag.children.length)</span></span>
<span data-line> </span>
<span data-line><span>        safeWaitFunc('body', (body) => {</span></span>
<span data-line><span>          document.body.appendChild(newBodyFrag)</span></span>
<span data-line><span>        })</span></span>
<span data-line><span>        safeWaitFunc('head', (body) => {</span></span>
<span data-line><span>          document.head.appendChild(newHeadFrag)</span></span>
<span data-line><span>        })</span></span>
<span data-line><span>        while (newDomFrag.firstChild) {</span></span>
<span data-line><span>          document.head.insertBefore(newDomFrag, document.head.firstChild)</span></span>
<span data-line><span>        }</span></span>
<span data-line><span>      }</span></span>
<span data-line><span>    }</span></span>
